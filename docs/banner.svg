<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="VenezuelaInfo">
  <!-- Franja de la bandera (como .flag-stripe del encabezado): amarillo / azul / rojo -->
  <rect x="0" y="0" width="400" height="18" fill="#FCDD09"/>
  <rect x="400" y="0" width="400" height="18" fill="#00247D"/>
  <rect x="800" y="0" width="400" height="18" fill="#CF142B"/>
  <!-- Panel azul (color de marca) -->
  <rect x="0" y="18" width="1200" height="282" fill="#00247D"/>
  <!-- Icono del sitio (bandera + sismógrafo), escalado desde static/icon.svg -->
  <g transform="translate(84,82) scale(2.16)">
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
    <g clip-path="url(#tile)">
      <rect width="64" height="64" fill="#00247D"/>
      <rect width="64" height="21.33" fill="#FCDD09"/>
      <rect y="42.66" width="64" height="21.34" fill="#CF142B"/>
    </g>
    <rect x="0.7" y="0.7" width="62.6" height="62.6" rx="11.4" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.85"/>
    <path d="M2 32 H20 L25 20 L31 46 L37 16 L43 32 H62" fill="none" stroke="#ffffff"
          stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="300" y="152" font-size="74" font-weight="800"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">Venezuela<tspan fill="#FCDD09">Info</tspan></text>
  <!-- Tagline -->
  <text x="303" y="206" font-size="26"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif" fill="#c7d3ef">Noticias · Clima · Finanzas · Sismos en vivo — hecho en Nyx</text>
</svg>
